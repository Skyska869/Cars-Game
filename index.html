<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Car Racing Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #333;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
        }
        #gameCanvas {
            background: #555;
            border: 4px solid #fff;
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 30px;
            border-radius: 15px;
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background: #2ecc71;
            border: none;
            color: white;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="ui">Score: <span id="score">0</span></div>

    <div id="startScreen">
        <h1>Car Race</h1>
        <p>Use Arrows or Tap Left/Right side</p>
        <button onclick="startGame()">START GAME</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const startScreen = document.getElementById('startScreen');

        // Настройки экрана под мобилки
        canvas.width = window.innerWidth > 400 ? 400 : window.innerWidth - 20;
        canvas.height = window.innerHeight > 600 ? 600 : window.innerHeight - 20;

        let score = 0;
        let gameActive = false;
        let animationId;

        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 100,
            w: 50,
            h: 80,
            speed: 7,
            color: '#e74c3c'
        };

        let enemies = [];
        let enemySpeed = 5;
        let frameCount = 0;

        // Управление
        let keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Управление для телефона (тач)
        window.addEventListener('touchstart', e => {
            const touchX = e.touches[0].clientX;
            if (touchX < window.innerWidth / 2) {
                keys['ArrowLeft'] = true;
            } else {
                keys['ArrowRight'] = true;
            }
        });
        window.addEventListener('touchend', () => {
            keys['ArrowLeft'] = false;
            keys['ArrowRight'] = false;
        });

        function startGame() {
            score = 0;
            enemySpeed = 5;
            enemies = [];
            gameActive = true;
            startScreen.style.display = 'none';
            scoreElement.innerText = score;
            update();
        }

        function createEnemy() {
            const w = 50;const h = 80; const x = Math.random() * (canvas.width - w); enemies.push({ x, y: -h, w, h, color: '#f1c40f' }); }
    function drawRect(obj) {
        ctx.fillStyle = obj.color;
        ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
        // Декоративные "фары"
        ctx.fillStyle = 'white';
        ctx.fillRect(obj.x + 5, obj.y + 5, 10, 10);
        ctx.fillRect(obj.x + obj.w - 15, obj.y + 5, 10, 10);
    }

    function gameOver() {
        gameActive = false;
        cancelAnimationFrame(animationId);
        startScreen.style.display = 'block';
        startScreen.innerHTML = `<h1>GAME OVER</h1><p>Score: ${score}</p><button onclick="startGame()">TRY AGAIN</button>`;
    }

    function update() {
        if (!gameActive) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Рисуем дорогу (разметка)
        ctx.strokeStyle = 'white';
        ctx.setLineDash([20, 20]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.stroke();

        // Движение игрока
        if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
        if (keys['ArrowRight'] && player.x < canvas.width - player.w) player.x += player.speed;

        drawRect(player);

        // Создание врагов
        frameCount++;
        if (frameCount % 60 === 0) {
            createEnemy();
            if (score > 0 && score % 5 === 0) enemySpeed += 0.2; // Усложнение
        }

        // Движение врагов
        for (let i = enemies.length - 1; i >= 0; i--) {
            enemies[i].y += enemySpeed;
            drawRect(enemies[i]);

            // Проверка столкновения
            if (
                player.x < enemies[i].x + enemies[i].w &&
                player.x + player.w > enemies[i].x &&
                player.y < enemies[i].y + enemies[i].h &&
                player.y + player.h > enemies[i].y
            ) {
                gameOver();
            }

            // Удаление врагов за экраном и очки
            if (enemies[i].y > canvas.height) {
                enemies.splice(i, 1);
                score++;
                scoreElement.innerText = score;
            }
        }

        animationId = requestAnimationFrame(update);
    }
</script>
